<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清華交換倒數</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 深色科技感漸層背景 */
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );
            overflow: hidden;
        }

        /* 背景微弱的光暈效果 */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 20%),
                radial-gradient(circle at 80% 30%, rgba(255,255,255,0.08), transparent 25%),
                radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 25%);
        }

        /* 核心毛玻璃卡片 */
        .card {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 50px;
            width: 90%;
            max-width: 700px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); /* 確保 Safari 瀏覽器相容性 */

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;

            color: white;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }

        .subtitle {
            letter-spacing: 3px;
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* 倒數數字漸層字體 */
        .days {
            font-size: 7rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(
                90deg,
                #ffffff,
                #93c5fd
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .label {
            margin-top: 10px;
            font-size: 1.3rem;
        }

        .target {
            margin-top: 30px;
            opacity: 0.7;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        /* 行動裝置響應式排版 */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .days {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="card">
        <div class="subtitle">
             
        </div>

        <div class="title">
            清華交換倒數
        </div>

        <div id="days" class="days">
            0
        </div>

        <div class="label">
            DAYS LEFT
        </div>

        <div class="target">
            目標日期：2026 年 9 月 6 日
        </div>

        <div class="footer">
             
        </div>
    </div>

    <script>
        // 設定目標日期（2026 年 9 月 6 日午夜 12 點）
        const targetDate = new Date("2026-09-06T00:00:00");

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            // 防呆機制：若時間已經過了目標日，強制將天數停留在 0
            if (diff <= 0) {
                document.getElementById("days").textContent = "0";
                return;
            }

            // 使用 Math.floor 計算無條件捨去後的完整剩餘天數
            // 例如：距離目標還有 5.8 天，代表還有「整整 5 天」加上幾小時，畫面會顯示 5
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            // 將計算結果更新到網頁畫面上
            document.getElementById("days").textContent = days;
        }

        // 網頁一載入時立刻執行一次，避免畫面出現預設的 0 闪烁
        updateCountdown();

        // 每隔 1 秒（1000 毫秒）自動重新計算並更新一次
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
